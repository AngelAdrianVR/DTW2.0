<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fondo festivo de Buen Fin con descuentos de hasta 20 por ciento">
    <defs>
        <linearGradient id="bfSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#150205" />
            <stop offset="34%" stop-color="#3a060d" />
            <stop offset="68%" stop-color="#7c0b16" />
            <stop offset="100%" stop-color="#c1121f" />
        </linearGradient>
        <radialGradient id="bfGlow" cx="50%" cy="64%" r="68%">
            <stop offset="0" stop-color="#ff4d4d" stop-opacity=".52" />
            <stop offset="52%" stop-color="#e01e2f" stop-opacity=".16" />
            <stop offset="100%" stop-color="#e01e2f" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="bfGoldGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffd166" stop-opacity=".32" />
            <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="bfFloor" cx="50%" cy="100%" r="60%">
            <stop offset="0" stop-color="#ffb703" stop-opacity=".28" />
            <stop offset="100%" stop-color="#ffb703" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="bfVignette" cx="50%" cy="48%" r="72%">
            <stop offset="55%" stop-color="#000000" stop-opacity="0" />
            <stop offset="100%" stop-color="#0a0103" stop-opacity=".72" />
        </radialGradient>
        <pattern id="bfStripes" width="96" height="96" patternTransform="rotate(34)" patternUnits="userSpaceOnUse">
            <rect width="30" height="96" fill="#ffffff" opacity=".022" />
        </pattern>
        <pattern id="bfDots" width="140" height="140" patternUnits="userSpaceOnUse">
            <circle cx="18" cy="24" r="2" fill="#ffd166" opacity=".20" />
            <circle cx="96" cy="74" r="1.6" fill="#ffffff" opacity=".14" />
            <circle cx="56" cy="112" r="1.4" fill="#ff8fa3" opacity=".18" />
            <rect x="116" y="18" width="6" height="6" rx="1" transform="rotate(24 119 21)" fill="#ffffff" opacity=".10" />
            <rect x="34" y="72" width="5" height="5" rx="1" transform="rotate(-18 36 74)" fill="#ffd166" opacity=".14" />
        </pattern>
    </defs>

    <rect width="1600" height="1000" fill="url(#bfSky)" />
    <rect width="1600" height="1000" fill="url(#bfGlow)" />
    <rect width="1600" height="1000" fill="url(#bfStripes)" />
    <rect width="1600" height="1000" fill="url(#bfDots)" />

    <!-- Porcentajes fantasma que dan profundidad al fondo -->
    <g fill="#ffffff" opacity=".045" font-family="'Arial Black', Arial, sans-serif" font-weight="900">
        <text x="40" y="300" font-size="300">20%</text>
        <text x="1230" y="200" font-size="190">%</text>
        <text x="1160" y="940" font-size="260">20%</text>
        <text x="-10" y="980" font-size="170" aria-hidden="true">-20%</text>
    </g>
    <g fill="#ffd166" opacity=".055" font-family="'Arial Black', Arial, sans-serif" font-weight="900">
        <text x="500" y="170" font-size="120">SALE</text>
        <text x="1280" y="560" font-size="120" transform="rotate(90 1280 560)">BUEN FIN</text>
    </g>

    <!-- Círculos de descuento punteados -->
    <circle cx="800" cy="500" r="330" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2" stroke-dasharray="14 20" />
    <circle cx="800" cy="500" r="410" fill="none" stroke="#ffd166" stroke-opacity=".055" stroke-width="2" />
    <circle cx="800" cy="500" r="250" fill="url(#bfGoldGlow)" />

    <!-- Luces bokeh -->
    <g fill="#ffd166">
        <circle cx="150" cy="130" r="110" opacity=".05" />
        <circle cx="1450" cy="230" r="90" opacity=".045" />
        <circle cx="240" cy="830" r="130" opacity=".04" />
        <circle cx="1330" cy="860" r="100" opacity=".045" />
    </g>

    <!-- Confeti estático -->
    <g>
        <rect x="180" y="330" width="16" height="6" rx="2" fill="#ffd166" opacity=".5" transform="rotate(32 188 333)" />
        <rect x="330" y="170" width="12" height="5" rx="2" fill="#ffffff" opacity=".35" transform="rotate(-24 336 172)" />
        <rect x="1250" y="330" width="18" height="6" rx="2" fill="#ffd166" opacity=".45" transform="rotate(48 1259 333)" />
        <rect x="1420" y="600" width="13" height="5" rx="2" fill="#ffffff" opacity=".3" transform="rotate(-40 1426 602)" />
        <rect x="120" y="700" width="14" height="5" rx="2" fill="#ffd166" opacity=".4" transform="rotate(20 127 702)" />
        <circle cx="430" cy="300" r="5" fill="#ffffff" opacity=".25" />
        <circle cx="1180" cy="260" r="4" fill="#ffd166" opacity=".5" />
        <circle cx="1050" cy="760" r="6" fill="#ffffff" opacity=".2" />
        <circle cx="560" cy="820" r="5" fill="#ffd166" opacity=".4" />
        <circle cx="1460" cy="470" r="4" fill="#ff8fa3" opacity=".45" />
    </g>

    <ellipse cx="800" cy="1020" rx="940" ry="240" fill="url(#bfFloor)" />
    <rect width="1600" height="1000" fill="url(#bfVignette)" />
</svg>
